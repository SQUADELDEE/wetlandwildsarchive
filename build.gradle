// Forge 1.21.1 port. Structure verified directly against the official Forge MDK
// (downloaded from maven.minecraftforge.net for 1.21.1-52.1.16) rather than guessed
// from memory, since ForgeGradle's conventions differ meaningfully from NeoForge's
// ModDevGradle plugin used on the neoforge-1.21.1 branch.
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = mod_group_id

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client') {
            // macOS's Cocoa UI framework requires GLFW to run on the process's actual
            // first thread; unlike NeoForge's ModDevGradle, ForgeGradle 7 doesn't inject
            // this automatically (confirmed absent from its source -- this is a known,
            // long-standing gap, see MinecraftForge/ForgeGradle#690). Without it, runClient
            // crashes immediately on macOS with "GLFW may only be used on the main thread".
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    // Hosts TerraBlender releases (see https://github.com/Glitchfiend/TerraBlender)
    maven {
        name = "Forge Maven (TerraBlender)"
        url = "https://maven.minecraftforge.net/releases/"
    }
    // Hosts GeckoLib releases (see https://github.com/bernie-g/geckolib)
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // TerraBlender: lets us register the wetlands biome into the Overworld's climate placement
    // and inject its surface rules, without hand-overriding vanilla's noise_settings/overworld.json.
    // ForgeGradle 7 removed fg.deobf() -- plain implementation() is correct now, confirmed
    // after the build itself rejected fg.deobf() as an unknown method.
    implementation "com.github.glitchfiend:TerraBlender-forge:${terrablender_version}"

    // GeckoLib: powers the animated blubber fish model.
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
# Disabled: ForgeGradle 7's mavenizer tool hit a real, reproducible race condition under
# parallel execution in this environment (concurrent Minecraft-artifact processing corrupted
# a shared cache file -- "zip END header not found" -- confirmed by re-running with
# --no-parallel, which resolved cleanly). Not a NeoForge-branch issue; that plugin doesn't
# use this mavenizer tool.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

## Environment Properties

# The Minecraft version this mod targets.
minecraft_version=1.21.1
# The Forge version, matched to the Minecraft version above.
# Find the latest at https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=52.1.16
# TerraBlender is used to register the wetlands biome into the Overworld's climate/placement system
# and to inject its surface rules, without hand-overriding vanilla's noise_settings/overworld.json.
terrablender_version=1.21.1-4.1.0.8
# GeckoLib powers the animated fish model (blubber fish).
geckolib_version=4.9.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=wetlandwilds
# The human-readable display name for the mod.
mod_name=wetlandwilds
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0-forge
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.squadeldee.wetlandwilds
